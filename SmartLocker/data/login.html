<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login - SmartLocker</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <main class="wrap">
        <div class="card">
            <h1>SmartLocker</h1>
            <p class="muted">Entre com seu e-mail e senha.</p>
            <p class="warn">{{ERRO}}</p>
            <form action="/login" method="POST"><label for="email">E-mail</label><input id="email" name="email"
                    type="email" required autocomplete="username"><label for="password">Senha</label><input
                    id="password" name="password" type="password" required autocomplete="current-password"><button
                    type="submit">Entrar</button></form>
        </div>
    </main>
</body>

</html>
